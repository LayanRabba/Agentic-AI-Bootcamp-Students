<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Agent with Memory & Budget</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        
        .header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 16px 16px 0 0;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .content {
            display: flex;
            flex: 1;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }
        
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .message {
            margin-bottom: 12px;
            display: flex;
            gap: 8px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.assistant {
            justify-content: flex-start;
        }
        
        .message.system {
            justify-content: center;
        }
        
        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.5;
        }
        
        .user .bubble {
            background: #667eea;
            color: white;
        }
        
        .assistant .bubble {
            background: #e5e7eb;
            color: #1f2937;
        }
        
        .system .bubble {
            background: #fef3c7;
            color: #92400e;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 12px;
        }
        
        .compacting {
            background: #dbeafe !important;
            color: #1e40af !important;
            border-left: 4px solid #3b82f6;
        }
        
        .input-area {
            display: flex;
            gap: 8px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .checkbox-group {
            display: flex;
            gap: 12px;
            align-items: center;
            font-size: 13px;
            color: #666;
        }
        
        .checkbox-group input[type="checkbox"] {
            cursor: pointer;
        }
        
        .sidebar {
            width: 280px;
            background: #f9fafb;
            border-radius: 8px;
            padding: 16px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
        }
        
        .sidebar h3 {
            font-size: 14px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .stat:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            color: #6b7280;
            font-weight: 500;
        }
        
        .stat-value {
            color: #1f2937;
            font-weight: 600;
            font-family: 'Monaco', 'Courier New', monospace;
        }
        
        .stat-value.warn {
            color: #f59e0b;
        }
        
        .stat-value.danger {
            color: #ef4444;
        }
        
        .memory-box {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 12px;
            margin-top: 12px;
            font-size: 12px;
        }
        
        .memory-box h4 {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        
        .memory-item {
            padding: 6px 0;
            color: #374151;
            border-left: 2px solid #d1d5db;
            padding-left: 8px;
            line-height: 1.4;
        }
        
        .loading {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #667eea;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .content {
                flex-direction: column-reverse;
            }
            .sidebar {
                width: 100%;
                max-height: 200px;
            }
            .bubble {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Chat Agent</h1>
            <p>Memory-aware conversation with token budgeting & compaction</p>
        </div>
        
        <div class="content">
            <div class="chat-section">
                <div class="messages" id="messages"></div>
                <div class="input-area">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Type your message..." 
                        autocomplete="off"
                    />
                    <button id="sendBtn">Send</button>
                </div>
            </div>
            
            <div class="sidebar">
                <h3>Memory Stats</h3>
                <div class="stat">
                    <span class="stat-label">Turns</span>
                    <span class="stat-value" id="turns">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Summaries</span>
                    <span class="stat-value" id="summaries">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Total Tokens</span>
                    <span class="stat-value" id="totalTokens">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Long-term Memories</span>
                    <span class="stat-value" id="longTermMemories">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Status</span>
                    <span class="stat-value" id="status" style="color: #10b981;">Ready</span>
                </div>
                
                <div class="memory-box">
                    <h4>Recent Context</h4>
                    <div class="memory-item" id="contextInfo">No context yet</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ws = new WebSocket(
            (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws'
        );
        
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        
        let currentMessageDiv = null;
        let isLoading = false;
        
        function addMessage(role, text = '') {
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            
            const bubble = document.createElement('div');
            bubble.className = `bubble`;
            if (text) bubble.textContent = text;
            
            msg.appendChild(bubble);
            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            return bubble;
        }
        
        function updateStats(budget) {
            if (budget) {
                document.getElementById('turns').textContent = budget.short_term_turns || 0;
                document.getElementById('summaries').textContent = budget.summaries || 0;
                document.getElementById('totalTokens').textContent = budget.total_tokens || 0;
                document.getElementById('longTermMemories').textContent = budget.long_term_memories || 0;
            }
        }
        
        ws.onopen = () => {
            console.log('Connected');
            document.getElementById('status').textContent = 'Connected';
            document.getElementById('status').style.color = '#10b981';
        };
        
        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                if (data.type === 'compacting') {
                    const msg = document.createElement('div');
                    msg.className = 'message system';
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble compacting';
                    bubble.textContent = '⚙️ ' + data.status;
                    msg.appendChild(bubble);
                    messagesDiv.appendChild(msg);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                } 
                else if (data.type === 'thinking') {
                    const msg = document.createElement('div');
                    msg.className = 'message system';
                    const bubble = document.createElement('div');
                    bubble.className = 'bubble';
                    bubble.textContent = '🔍 ' + data.text;
                    msg.appendChild(bubble);
                    messagesDiv.appendChild(msg);
                }
                else if (data.type === 'token') {
                    if (!currentMessageDiv) {
                        currentMessageDiv = addMessage('assistant');
                    }
                    currentMessageDiv.textContent += data.text;
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
                else if (data.type === 'budget') {
                    updateStats(data.data);
                }
                else if (data.type === 'done') {
                    currentMessageDiv = null;
                    isLoading = false;
                    sendBtn.disabled = false;
                    messageInput.disabled = false;
                    messageInput.focus();
                }
                else if (data.type === 'error') {
                    const msg = addMessage('system', '❌ Error: ' + data.text);
                    isLoading = false;
                    sendBtn.disabled = false;
                    messageInput.disabled = false;
                }
            } catch (e) {
                console.error('Parse error:', e);
            }
        };
        
        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
            document.getElementById('status').textContent = 'Disconnected';
            document.getElementById('status').style.color = '#ef4444';
        };
        
        ws.onclose = () => {
            console.log('Disconnected');
            document.getElementById('status').textContent = 'Disconnected';
            document.getElementById('status').style.color = '#ef4444';
        };
        
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || isLoading) return;
            
            isLoading = true;
            sendBtn.disabled = true;
            messageInput.disabled = true;
            
            addMessage('user', text);
            
            ws.send(JSON.stringify({
                message: text
            }));
            
            messageInput.value = '';
        }
        
        sendBtn.onclick = sendMessage;
        messageInput.onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };
    </script>
</body>
</html>
